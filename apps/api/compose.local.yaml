services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: gloups_auth003
      POSTGRES_DB: gloups_auth003
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:25440:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gloups_auth003 -d gloups_auth003"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres:
