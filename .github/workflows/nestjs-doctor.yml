name: nestjs-doctor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nestjs-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # The repository's fork approval policy is enforced separately by infra.
    runs-on: >-
      ${{ fromJSON(
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && '["self-hosted","Linux","ARM64","gloups-health"]'
        || '["ubuntu-latest"]'
      ) }}
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The same full scan used by pre-commit. Every severity blocks, including
      # informational findings that do not affect the upstream numeric score.
      - run: bun run check:nest
