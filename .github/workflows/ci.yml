name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Forks use GitHub-hosted runners. Infra also requires approval for every
    # external contributor: a fork can edit this workflow and its runs-on value.
    runs-on: >-
      ${{ fromJSON(
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        && '["self-hosted","Linux","ARM64","gloups-health"]'
        || '["ubuntu-latest"]'
      ) }}
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: https://api.example.test
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify Docker runtime
        run: docker info
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:boundaries
      - run: bun run contracts:check
      - run: bun run typecheck
      - run: bun run ui:test:web
      - run: bun run api:build
      - run: bun run test:cqrs
      - run: bun run test:mobile:unit
      - run: bun run mobile:build
      - run: bun run test:api
